<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Ideas, Made Real — an original abstract visual study</title>
  <desc id="desc">A luminous yellow green loop on a dark architectural grid. Original reference artwork created for this prototype, not a personal project or portfolio claim.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a100f"/><stop offset=".55" stop-color="#18221b"/><stop offset="1" stop-color="#0d1310"/></linearGradient>
    <linearGradient id="loop" x1=".12" y1=".1" x2=".9" y2=".8"><stop stop-color="#f0ff9b"/><stop offset=".22" stop-color="#dfff00"/><stop offset=".62" stop-color="#b3d700"/><stop offset="1" stop-color="#68892f"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#dfff00" stop-opacity=".18"/><stop offset="1" stop-color="#dfff00" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".63"/></radialGradient>
    <pattern id="grid" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M 100 0 L 0 0 0 100" fill="none" stroke="#c9d9c0" stroke-width=".7" opacity=".19"/></pattern>
    <filter id="shadow" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="33"/></filter>
    <filter id="soft" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#background)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <g stroke="#c9d9c0" fill="none" stroke-width=".8" opacity=".15"><path d="M0 800H1600M0 850H1600M0 910H1600M0 980H1600M800 650 50 1000M800 650 375 1000M800 650 650 1000M800 650 950 1000M800 650 1225 1000M800 650 1550 1000"/></g>
  <ellipse cx="840" cy="815" rx="385" ry="60" fill="#000" opacity=".68" filter="url(#shadow)"/>
  <ellipse cx="815" cy="515" rx="610" ry="470" fill="url(#glow)"/>
  <g transform="translate(800 474) rotate(-27)">
    <ellipse rx="331" ry="239" fill="none" stroke="#cddd30" stroke-width="100" opacity=".07" filter="url(#soft)"/>
    <ellipse cy="24" rx="314" ry="227" fill="none" stroke="#506921" stroke-width="88"/>
    <ellipse rx="314" ry="227" fill="none" stroke="url(#loop)" stroke-width="88"/>
    <ellipse cy="-9" rx="313" ry="226" fill="none" stroke="#f0ffb2" stroke-width="1.7" opacity=".4"/>
    <ellipse cy="3" rx="270" ry="183" fill="none" stroke="#17230d" stroke-width="2" opacity=".8"/>
  </g>
  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <g fill="#cdd7c3" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3">
    <text x="62" y="73">FORM FOLLOWS AN IDEA.</text><text x="1538" y="73" text-anchor="end">STUDY / 001</text>
    <text x="62" y="934" font-size="11" letter-spacing="2" opacity=".72">ORIGINAL REFERENCE VISUAL · NOT A PORTFOLIO PROJECT</text>
    <text x="1538" y="934" text-anchor="end" font-size="11" letter-spacing="2" opacity=".72">STRATEGY × CREATIVITY</text>
  </g>
  <g stroke="#dae3d2" stroke-width="1" opacity=".65"><path d="M63 103v18m-9-9h18M1538 103v18m-9-9h18M63 877v18m-9-9h18M1538 877v18m-9-9h18"/></g>
  <g fill="#dfff00"><circle cx="799" cy="865" r="3"/><circle cx="815" cy="865" r="3" opacity=".25"/><circle cx="831" cy="865" r="3" opacity=".25"/></g>
</svg>
